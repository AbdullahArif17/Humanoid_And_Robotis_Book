name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm install
        working-directory: ./book
      
      - name: Build Docusaurus website
        run: npm run build
        working-directory: ./book
        env:
          # Configure these environment variables for your deployment
          GITHUB_ORGANIZATION_NAME: AbdullahArif17
          GITHUB_PROJECT_NAME: Humanoid_And_Robotis_Book
          PROJECT_BASE_URL: /Humanoid_And_Robotis_Book/
          GITHUB_PAGES_URL: https://abdullaharif17.github.io/Humanoid_And_Robotis_Book
          GITHUB_REPO_EDIT_URL: https://github.com/AbdullahArif17/Humanoid_And_Robotis_Book/tree/main/book/
          GITHUB_REPO_URL: https://github.com/AbdullahArif17/Humanoid_And_Robotis_Book
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/build
          publish_branch: gh-pages